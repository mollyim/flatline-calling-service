[workspace]
resolver = "2"
members = [
    "backend",
    "load_test",
    "common",
    "docker/bootstrap",
    "frontend",
    "metrics",
]

[workspace.package]
version = "138.0.0"
edition = "2021"

[profile.release]
debug = 1
panic = "abort"
lto = "fat"
codegen-units = 1
